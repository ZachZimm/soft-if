name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SOFTIF_LIVE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm example && node dist/examples/tiered.js
      - name: Pack and install in an independent consumer
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP/package"
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/package/*.tgz
          node --input-type=module -e 'await import("soft-if"); await import("soft-if/node")'
          npx --no-install softif ask --backend fake --state test --noul 'q=Local file?' > answer.json
          node --input-type=module -e 'import { readFileSync } from "node:fs"; if (JSON.parse(readFileSync("answer.json", "utf8")).q.p !== 0.9) throw Error("CLI smoke failed")'
